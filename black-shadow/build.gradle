plugins {
    id 'com.android.library'
}

android {
    namespace 'top.niunaijun.shadow'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def shadowVersion = "1.0-local"
    implementation "com.tencent.shadow.dynamic:host:$shadowVersion"
    implementation "com.tencent.shadow.core:common:$shadowVersion"
    implementation "com.tencent.shadow.core:activity-container:$shadowVersion"
    implementation "com.tencent.shadow.core:loader:$shadowVersion"
    implementation "com.tencent.shadow.dynamic:loader:$shadowVersion"
    implementation "com.tencent.shadow.dynamic:loader-impl:$shadowVersion"
    implementation "com.tencent.shadow.dynamic:host-multi-loader-ext:$shadowVersion"
    implementation "com.tencent.shadow.dynamic:manager-multi-loader-ext:$shadowVersion"

    implementation "com.tencent:mmkv-static:1.3.2"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation project(":black-shadow:ManifestEditor")
}